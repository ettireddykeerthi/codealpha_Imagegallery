<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>📸 Image Gallery</h1>
        <p>Explore beautiful images</p>
    </header>

    <!-- Filter Buttons -->
    <div class="filters">
        <button class="filter-btn active" onclick="filterImages('all')">All</button>
        <button class="filter-btn" onclick="filterImages('nature')">Nature</button>
        <button class="filter-btn" onclick="filterImages('city')">City</button>
        <button class="filter-btn" onclick="filterImages('animals')">Animals</button>
    </div>

    <!-- Gallery -->
    <div class="gallery">

        <div class="image-card nature">
            <img src="https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=800&q=80"
                 alt="Nature">
        </div>

        <div class="image-card city">
            <img src="https://images.unsplash.com/photo-1477959858617-67f85cf4f1df?auto=format&fit=crop&w=800&q=80"
                 alt="City">
        </div>

        <div class="image-card animals">
            <img src="https://images.unsplash.com/photo-1546182990-dffeafbe841d?auto=format&fit=crop&w=800&q=80"
                 alt="Lion">
        </div>

        <div class="image-card nature">
            <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=800&q=80"
                 alt="Forest">
        </div>

        <div class="image-card city">
            <img src="https://images.unsplash.com/photo-1449824913935-59a10b8d2000?auto=format&fit=crop&w=800&q=80"
                 alt="City">
        </div>

        <div class="image-card animals">
            <img src="https://images.unsplash.com/photo-1557050543-4d5f4e07ef46?auto=format&fit=crop&w=800&q=80"
                 alt="Elephant">
        </div>

        <div class="image-card nature">
            <img src="https://images.unsplash.com/photo-1501854140801-50d01698950b?auto=format&fit=crop&w=800&q=80"
                 alt="Mountain">
        </div>

        <div class="image-card city">
            <img src="https://images.unsplash.com/photo-1519501025264-65ba15a82390?auto=format&fit=crop&w=800&q=80"
                 alt="City">
        </div>

    </div>

    <!-- Lightbox -->
    <div id="lightbox" class="lightbox">

        <span class="close" onclick="closeLightbox()">&times;</span>

        <button class="prev" onclick="previousImage()">❮</button>

        <img id="lightbox-img" src="" alt="Large Image">

        <button class="next" onclick="nextImage()">❯</button>

    </div>

    <script src="script.js"></script>

</body>
</html>
